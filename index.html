<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fitness Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="menu-btn" class="menu-btn" type="button"
              aria-haspopup="true" aria-expanded="false" aria-controls="menu" aria-label="Menu">
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>

      <nav id="menu" class="menu" aria-label="Primary" hidden>
        <a href="#/" data-route="/">Dashboard</a>
        <a href="#/weight" data-route="/weight">Weight</a>
        <a href="#/food" data-route="/food">Food</a>
        <a href="#/workout" data-route="/workout">Workout</a>
        <a href="#/settings" data-route="/settings">Settings</a>
      </nav>

      <button id="sync-badge" class="sync-badge" type="button" title="Pending changes">0</button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
